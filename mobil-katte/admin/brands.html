<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand — Mobil Katte Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
</head>
<body>
  <div class="admin">
    <div id="adminSidebar"></div>
    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <button class="admin-burger" onclick="toggleAdminNav()">☰</button>
          <h1>Kelola Brand</h1>
          <div class="sub">Daftar brand mobil yang tersedia di katalog</div>
        </div>
        <button class="btn btn--primary" onclick="addBrandForm()">+ Tambah Brand</button>
      </div>

      <div class="data-toolbar">
        <div class="search"><span class="search-icon" id="icSearch"></span><input id="brandSearch" type="text" placeholder="Cari brand..." oninput="renderBrands()" /></div>
      </div>

      <div class="card-panel">
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>No</th><th>Nama Brand</th><th>Slug</th><th>Jumlah Mobil</th><th>Action</th></tr></thead>
            <tbody id="brandRows"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="brandModal">
    <div class="modal">
      <div class="modal-icon" style="background:var(--accent-soft);color:var(--accent-dark);" id="icBrand">SVG_BRAND</div>
      <h3 id="brandModalTitle">Tambah Brand</h3>
      <div class="field">
        <label>Nama Brand</label>
        <input id="brandInput" type="text" placeholder="contoh: Toyota" />
      </div>
      <div class="modal-actions mt-24">
        <button class="btn btn--outline" onclick="closeBrandModal()">Batal</button>
        <button class="btn btn--primary" onclick="saveBrand()">Simpan</button>
      </div>
    </div>
  </div>

  <script src="../js/data.js?v=4"></script>
  <script src="../js/main.js?v=4"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
