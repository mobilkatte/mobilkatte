<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Mobil — Mobil Katte Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css?v=2" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚗</text></svg>" />
</head>
<body>
  <div class="admin">
    <div id="adminSidebar"></div>
    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <button class="admin-burger" onclick="toggleAdminNav()">☰</button>
          <h1>Data Mobil</h1>
          <div class="sub">Kelola seluruh kendaraan di katalog</div>
        </div>
        <a href="car-form.html" class="btn btn--primary">+ Tambah Mobil</a>
      </div>

      <div class="data-toolbar">
        <div class="search"><span class="search-icon" id="icSearch"></span><input id="tableSearch" type="text" placeholder="Cari mobil, brand, tipe..." oninput="renderCarsTable()" /></div>
        <div class="filters">
          <select id="fBrand" onchange="renderCarsTable()"><option value="">Semua Brand</option></select>
          <select id="fTax" onchange="renderCarsTable()"><option value="">Semua Pajak</option><option>Aktif</option><option>Tidak Aktif</option></select>
          <select id="fStatus" onchange="renderCarsTable()"><option value="">Semua Status</option><option>Tersedia</option><option>Dipesan</option><option>Terjual</option><option>Tidak Aktif</option></select>
        </div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Foto</th><th>Mobil</th><th>Type</th><th>Tahun</th><th>Harga</th><th>Pajak</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="carsRows"></tbody>
        </table>
      </div>

      <div class="pagination" id="carsPagination"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="deleteModal">
    <div class="modal">
      <div class="modal-icon" id="icTrash">SVG_TRASH</div>
      <h3>Hapus Kendaraan?</h3>
      <p>Apakah Anda yakin ingin menghapus kendaraan ini?</p>
      <div class="modal-actions">
        <button class="btn btn--outline" onclick="closeDeleteModal()">Batal</button>
        <button class="btn btn--dark" id="confirmDeleteBtn" onclick="confirmDelete()">Hapus</button>
      </div>
    </div>
  </div>

  <script src="../js/data.js?v=4"></script>
  <script src="../js/main.js?v=4"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
